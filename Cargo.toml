[package]
name = "keep-at"
version = "0.8.1"
edition = "2021"
description = "A smart node that seeds Academic Torrents"
license = "MIT"
repository = "https://github.com/tweedge/keep-at"
rust-version = "1.88"

[[bin]]
name = "keep-at"
path = "src/bin/keep-at.rs"

[lib]
name = "keep_at"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
bincode = "1.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
hex = "0.4"
humantime = "2"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "http-api-client"] }
librqbit-bencode = { package = "librqbit-bencode", version = "9.0.1", default-features = false }
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }
quick-xml = { version = "0.36", features = ["serialize"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.30"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
