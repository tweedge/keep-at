name: ci

# Fast checks on every push and pull request: formatting, lints, and the
# full hermetic suite (unit + integration). Live smoke tests (KEEPAT_SMOKE_*)
# stay opt-in - they need real network access to Academic Torrents.
on:
  push:
  pull_request:

# Least privilege: CI only reads the repo (checkout) and runs local checks.
# (The release workflow needs contents:write to publish; this one must not.)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (mutable tags/branches can be
      # silently repointed by their owners); bump the SHA to update.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (unit + hermetic integration)
        run: cargo test --locked
