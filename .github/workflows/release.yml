name: release

# Builds Linux binaries (glibc-linked) and publishes them as a GitHub release
# whenever a version tag is pushed. Versioning scheme: stable releases are
# `x.y` (e.g. v0.9), development builds are `x.y.z-beta` (e.g. v0.9.1-beta).
# Three-component tags publish as GitHub prereleases, so the updater's
# default (non-beta) mode — which resolves via /releases/latest, skipping
# prereleases — never pulls a development build. Examples:
#
#   git tag v0.9 && git push origin v0.9           # stable
#   git tag v0.9.1-beta && git push origin v0.9.1-beta  # development beta
#
# Needs no repo secrets: GITHUB_TOKEN is provided automatically by
# Actions, and the `contents: write` permission below is what lets this
# workflow create the release and upload assets with it.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross targets and C cross-compilers
        run: |
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf i686-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-i686-linux-gnu

      - name: Run tests
        run: cargo test --locked

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ls -la dist/
          notes_file="RELEASE_NOTES.md"
          if [ ! -f "$notes_file" ]; then
            notes_file=/dev/null
          fi
          args=()
          # Development builds (x.y.z-beta) publish as GitHub prereleases
          # so plain `keep-at self-update` never pulls them; stable x.y
          # tags publish as full releases. The tag shape is the source of
          # truth (mirrors updater::channel_of), not a suffix allowlist.
          case "${{ github.ref_name }}" in
            *-beta|*-rc|*-alpha) args+=(--prerelease) ;;
          esac
          gh release create "${{ github.ref_name }}" dist/*.tar.gz \
            -R "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$notes_file" \
            "${args[@]}"
