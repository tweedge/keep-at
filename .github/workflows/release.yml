name: release

# Builds cross-platform binaries and publishes them as a GitHub release
# whenever a version tag is pushed, e.g.:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Needs no repo secrets: GITHUB_TOKEN is provided automatically by
# Actions, and the `contents: write` permission below is what lets this
# workflow create the release and upload assets with it.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ls -la dist/
          notes_file="RELEASE_NOTES.md"
          if [ ! -f "$notes_file" ]; then
            notes_file=/dev/null
          fi
          gh release create "${{ github.ref_name }}" dist/*.tar.gz \
            -R "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$notes_file"
